<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プライバシーポリシー</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="document.css">

    <!-- Render Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Prevent FOUC Theme Script -->
    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.add('light');
        }
    </script>
</head>

<body>
    <div class="container">
        <div class="header-actions">
            <a href="index.html" class="back-button">← メニューへ戻る</a>
            <button id="themeToggleBtn" class="theme-toggle" aria-label="Toggle Theme">
                <span class="material-symbols-outlined dark-icon">dark_mode</span>
                <span class="material-symbols-outlined light-icon">light_mode</span>
            </button>
        </div>

        <h1>プライバシーポリシー</h1>
        <div id="markdown-content">読み込み中...</div>
    </div>

    <script>
        // Fetch and parse the markdown
        fetch('privacy.md')
            .then(res => res.text())
            .then(text => {
                document.getElementById('markdown-content').innerHTML = marked.parse(text);
            })
            .catch(err => {
                document.getElementById('markdown-content').innerHTML = '<p>内容の読み込みに失敗しました。</p>';
                console.error('Error loading markdown:', err);
            });

        // Theme Toggle
        const themeBtn = document.getElementById('themeToggleBtn');
        const toggleTheme = () => {
            const isDark = document.documentElement.classList.contains('dark') ||
                (window.matchMedia('(prefers-color-scheme: dark)').matches && !document.documentElement.classList.contains('light'));

            if (isDark) {
                document.documentElement.classList.remove('dark');
                document.documentElement.classList.add('light');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                document.documentElement.classList.remove('light');
                localStorage.theme = 'dark';
            }
        };
        themeBtn.addEventListener('click', toggleTheme);
    </script>
</body>

</html>
